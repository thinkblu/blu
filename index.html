<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Foto Kerja Kolam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single narrow column for field phones; sticky header, list rows, 3-up photo tiles, sticky submit bar */
:root{
  --bg:#edf1f7; --surface:#ffffff; --sunken:#e1e7f0; --ink:#0f1c36; --muted:#56637c; --line:#cfd7e4;
  --accent:#1a3a70; --accent-ink:#ffffff; --accent-soft:#dce5f3;
  --nav:#132a52; --nav-ink:#ffffff; --nav-muted:#a9bbdb; --nav-ctl:rgba(255,255,255,.1); --nav-line:rgba(255,255,255,.18);
  --ok:#1b7a3d; --ok-soft:#d9f0e1; --warn:#b85f00; --warn-soft:#fbe8d2; --danger:#b3261e;
  --scrim:rgba(6,12,26,.96);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09111f; --surface:#101b31; --sunken:#16243e; --ink:#e3e9f3; --muted:#93a1bb; --line:#22314e;
  --accent:#7ea6e6; --accent-ink:#081226; --accent-soft:#1a2d50;
  --nav:#0d1d3b; --nav-ink:#ffffff; --nav-muted:#93a8cf; --nav-ctl:rgba(255,255,255,.08); --nav-line:rgba(255,255,255,.14);
  --ok:#55c983; --ok-soft:#173826; --warn:#f2a54a; --warn-soft:#3b2810; --danger:#ff8a80;
  --scrim:rgba(2,6,14,.96); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09111f; --surface:#101b31; --sunken:#16243e; --ink:#e3e9f3; --muted:#93a1bb; --line:#22314e;
  --accent:#7ea6e6; --accent-ink:#081226; --accent-soft:#1a2d50;
  --nav:#0d1d3b; --nav-ink:#ffffff; --nav-muted:#93a8cf; --nav-ctl:rgba(255,255,255,.08); --nav-line:rgba(255,255,255,.14);
  --ok:#55c983; --ok-soft:#173826; --warn:#f2a54a; --warn-soft:#3b2810; --danger:#ff8a80;
  --scrim:rgba(2,6,14,.96); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);padding-inline:16px;padding-block:0 32px}
.wrap{max-width:560px;margin:0 auto}
button,input,label{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--nav);color:var(--nav-ink);margin-inline:-16px;padding:12px 16px;border-bottom:3px solid var(--accent)}
.top-row{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.brand{font:700 1.3rem/1 var(--f-display);letter-spacing:.01em;flex:1;min-width:0;text-transform:uppercase}
.brand small{display:block;font:500 .72rem/1.3 var(--f-mono);letter-spacing:.06em;color:var(--nav-muted);text-transform:uppercase;margin-top:3px}
.datebox{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.datebox label{font:500 .66rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--nav-muted)}
.month{display:flex;align-items:center;background:var(--nav-ctl);border:1px solid var(--nav-line);color:var(--nav-ink);border-radius:8px;overflow:hidden}
.month button{background:none;border:0;width:34px;height:34px;display:grid;place-items:center;color:var(--nav-ink)}
.month button svg{width:16px;height:16px}
.month button:disabled{color:var(--nav-line);cursor:default}
.month output{min-width:7.2em;text-align:center;font:600 .9rem var(--f-body);white-space:nowrap}

.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600}
.back svg{width:18px;height:18px}

.banner{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:.92rem;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner b{color:var(--warn)}

h1{font:700 2rem/1.05 var(--f-display);margin:14px 0 4px;text-wrap:balance;letter-spacing:.005em}
.lede{color:var(--muted);margin:0 0 18px}
.eyebrow{font:500 .72rem/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Zone picker */
.zones{display:grid;gap:14px;margin-top:8px}
.zone{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;transition:border-color .15s,transform .15s}
.zone:hover{border-color:var(--accent)}
.zone:active{transform:scale(.99)}
.zone-letter{width:64px;height:64px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 2.6rem/1 var(--f-display)}
.zone-name{display:block;font:700 1.5rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.zone-meta{display:block;color:var(--muted);font-size:.9rem;margin-top:4px}
.zone-meta .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-warn{background:var(--warn)} .bar .b-ready{background:var(--accent)} .bar .b-fix{background:var(--danger)}
.zalerts{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.za{display:block;font-weight:600;font-size:.85rem}
.za svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.za-fix,.za-fix .num{color:var(--danger)!important}
.za-pend,.za-pend .num{color:var(--accent)!important}
.za-unsent,.za-unsent .num{color:var(--warn)!important}
/* Perlu tindakan */
.todo{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.todo:empty{display:none}
.todo-h{display:flex;align-items:center;gap:8px}
.todo-h svg{width:18px;height:18px;color:var(--danger)}
.todo-h h2{font:700 1.2rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;flex:1}
.todo-h .num{font:600 .95rem var(--f-mono);font-variant-numeric:tabular-nums}
.todo-h.sub{margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.tlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--sunken)}
.trow-main{display:flex;flex-direction:column;min-width:0}
.trow-note{color:var(--danger);font-size:.85rem;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.trow-note b{font-weight:600}
.tmore{padding:10px 12px;color:var(--muted);font-size:.85rem}
.qbtns{display:grid;gap:8px}
.qbtn{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:10px;padding:12px 14px}
.qbtn b{font:700 1.05rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--accent)}
.qbtn .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.qbtn .chev{color:var(--accent)}
.chev{width:22px;height:22px;color:var(--muted)}

/* Sign-in */
.auth{max-width:420px;margin:28px auto 0}
.auth h1{margin-top:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border-radius:10px;padding:4px;margin:4px 0 18px}
.seg button{border:0;background:none;border-radius:8px;padding:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.form{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font:500 .72rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1rem;width:100%}
.field select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1rem;width:100%}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field small{color:var(--muted);font-size:.8rem}
.form-err{margin:0;color:var(--danger);font-size:.9rem;font-weight:500}
.auth-note{color:var(--muted);font-size:.88rem;text-align:center;margin:14px 0 0}
.whoami{display:flex;align-items:center;gap:10px;margin:14px 0 -4px;font-size:.9rem;color:var(--muted)}
.whoami b{color:var(--ink);font-weight:600}


.pw-hint{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.pw-hint.ok{color:var(--ok)} .pw-hint.bad{color:var(--warn)}
.pw-hint b{font-family:var(--f-mono);font-weight:500}
.whoami{flex-wrap:wrap}
.whoami .links{margin-left:auto;display:flex;gap:14px}
.admin-link{display:block;margin:10px auto 0;text-align:center}
/* Admin */
.ulist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.urow{display:flex;flex-direction:column;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.urow-main{flex:1;min-width:0}
.urow-n{font-weight:600}
.urow-s{color:var(--muted);font-size:.85rem}
.urow-s code{font-family:var(--f-mono);font-size:.82rem;color:var(--ink)}
.urow-act{display:flex;gap:8px}
.sbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-weight:600;font-size:.85rem;color:var(--accent)}
.sbtn.danger{color:var(--danger)}
.sbtn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sbtn.solid-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.sbtn:disabled{opacity:.6;cursor:default}
.uedit{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.uedit p{margin:0;font-size:.9rem}
.uedit .row-btns{display:flex;gap:8px;justify-content:flex-end}

/* Admin: storage and monthly photos */
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.acard h2,.ahead{font:700 1.2rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.ahead{margin:22px 0 6px}
.acard-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font:600 1.6rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.big small{font:500 .85rem var(--f-body);color:var(--muted);margin-left:4px}
.meter{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.hi i{background:var(--warn)}
.muted{color:var(--muted);font-size:.88rem}
.muted .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.mstep{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mstep button{background:none;border:0;width:34px;height:34px;display:grid;place-items:center;color:var(--accent)}
.mstep button svg{width:16px;height:16px}
.mstep button:disabled{color:var(--line);cursor:default}
.mstep output{min-width:8em;text-align:center;font-weight:600}
.abtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.abtns{grid-template-columns:1fr}}
.btn.line{background:var(--surface);border:1px solid var(--accent);color:var(--accent)}
.btn.line-danger{background:var(--surface);border:1px solid var(--danger);color:var(--danger)}
.btn.danger{background:var(--danger);color:#fff}
.btn.line:disabled,.btn.line-danger:disabled{border-color:var(--line);color:var(--muted);background:var(--surface)}
.warnbox{border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--surface));border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.warnbox b.t{color:var(--danger);font-size:1rem}
.warnbox p{margin:0;font-size:.92rem}
.warnbox ol{margin:0;padding-left:20px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--danger)}
.okline{color:var(--ok);font-weight:600;font-size:.88rem}

.topbrand{display:flex;justify-content:center;align-items:center;background:#ffffff;margin-inline:-16px;padding:14px 16px;border-bottom:1px solid var(--line)}
.topbrand img{display:block;height:56px;width:auto;max-width:100%}

.extra-h{display:flex;flex-direction:column;gap:2px;margin:28px 0 14px;padding-top:14px;border-top:1px dashed var(--line)}
.extra-h b{font:700 1rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.extra-h span{font-size:.85rem;color:var(--muted)}
.task.extra .task-h{border-bottom-color:var(--line)}
.task.extra .task-h h2{font-size:1.15rem}
.tiles.tiles-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:480px){.tiles.tiles-4{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.tiles-4 .tile{aspect-ratio:4/3}}

/* Monthly Excel export */
.export{margin-top:18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.export-ic{grid-row:span 2;width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.export-ic svg{width:24px;height:24px}
.export-t{font-weight:600;line-height:1.25}
.export-s{color:var(--muted);font-size:.88rem}
.export-left{display:block;color:var(--warn);font-weight:600;margin-top:2px}
.export-left .num{color:var(--warn)!important}
.export-s .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.export .btn{grid-column:1/-1;margin-top:10px}
.xrange{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.xrange .field{min-width:0}
.xrange input{-webkit-appearance:none;appearance:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 10px;font-size:1rem;width:100%;min-width:0;color:var(--ink)}
.xrange input:disabled{opacity:.6}
.xquick{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.xsum{grid-column:1/-1;margin-top:8px;font-size:.88rem;min-height:1.3em}
.xsum .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.xerr{color:var(--danger);font-weight:600}
.export-bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:10px}
.export-bar i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* Location list */
.search{position:relative;margin:6px 0 10px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 40px;font-size:1rem}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:500}
.chip .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chip.c-fix{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.chip.c-fix[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.row-pend{font:600 .72rem var(--f-mono);color:var(--accent)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunken)}
.row-main{min-width:0}
.row-t{font-weight:600;line-height:1.25}
.row-s{color:var(--muted);font-size:.88rem;margin-top:2px}
.row-d{display:flex;align-items:center;gap:5px;margin-top:4px;font:500 .74rem/1.2 var(--f-mono);color:var(--ok)}
.row-d svg{width:12px;height:12px;flex:none}
.nw{white-space:nowrap}
.row-n{margin-top:4px;font-size:.8rem;color:var(--ink);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note textarea{display:block;width:100%;min-height:96px;resize:vertical;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.4}
.note textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.note textarea:disabled{opacity:.7}
.note-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.note-meta{font:500 .78rem/1.3 var(--f-mono);color:var(--muted)}
.note-dirty{color:var(--warn);font-weight:600}
.note .sbtn{min-width:96px;min-height:38px}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dots{display:grid;grid-template-columns:repeat(8,6px);gap:2px}
.dots i{width:6px;height:6px;border-radius:2px;background:var(--sunken);border:1px solid var(--line)}
.dots i.pend{background:var(--accent);border-color:var(--accent)}
.dots i.draft{background:var(--warn-soft);border-color:var(--warn)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.flag{background:var(--danger);border-color:var(--danger)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font:600 .74rem/1.6 var(--f-body);letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-none{background:var(--sunken);color:var(--muted)}
.p-prog{background:var(--warn-soft);color:var(--warn)}
.p-ready{background:var(--accent-soft);color:var(--accent)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-check{background:var(--accent-soft);color:var(--accent)}
.p-unsent{background:var(--warn-soft);color:var(--warn)}
.p-ready{background:var(--ok-soft);color:var(--ok)}
.p-fix{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}

/* Location page */
.loc-head{margin:6px 0 18px}
.loc-head h1{margin-top:6px}
.loc-sub{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted)}
.navlinks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.navlinks a{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:12px 10px}
.navlinks a svg{width:18px;height:18px;flex:none}
.navlinks a.waze{background:var(--surface);border:1px solid var(--accent);color:var(--accent)}
.kolam{font:600 .8rem/1 var(--f-mono);letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);padding:5px 8px;border-radius:6px}
.task{margin-bottom:22px}
.task-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:12px}
.task-h h2{font:700 1.35rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.task-h .cnt{font:500 .85rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.task-h .cnt.full{color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot-l{font:600 .78rem/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.slot-l .req{color:var(--danger)}
.slot-l .tick{color:var(--ok)}
.slot-l .xmark{color:var(--danger)}
.slot{container-type:inline-size}
.tacts{display:grid;grid-template-columns:1fr;gap:4px}
@container (min-width:150px){.tacts{grid-template-columns:1fr 1fr}}
.tact{display:flex;align-items:center;justify-content:center;gap:5px;min-height:34px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--accent);font:600 .74rem/1 var(--f-body);cursor:pointer;white-space:nowrap;min-width:0}
.tact svg{width:14px;height:14px;flex:none}
.tact.danger{color:var(--danger)}
.tact:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.tacts.ask{align-items:center}
.tacts.ask span{grid-column:1/-1;text-align:center;font-weight:600;font-size:.78rem;color:var(--danger)}
.tacts.ask .tact.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.slot-note{color:var(--danger);font-size:.78rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile.filled.rv-flag{border:3px solid var(--danger)}
.tile.filled.rv-ok{border-color:var(--ok)}
.tile-rv{position:absolute;top:5px;right:5px;display:inline-flex;align-items:center;gap:3px;font:600 .62rem/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 5px;border-radius:4px;color:#fff}
.tile-rv svg{width:11px;height:11px}
.tile-rv.ok{background:var(--ok);padding:4px;border-radius:50%}
.tile-rv.ok svg{width:12px;height:12px}
.tile-rv.flag{background:#c62828}
.tile-rv.pend{background:rgba(15,28,54,.78)}
.tile-rv.draft{background:var(--warn)}
.sentline{display:flex;align-items:center;gap:6px;margin-top:8px;font:500 .8rem/1.3 var(--f-mono);color:var(--muted)}
.sentline svg{width:14px;height:14px;color:var(--ok);flex:none}
.btn.send{display:flex;align-items:center;justify-content:center;gap:8px}
.btn.send svg{width:18px;height:18px}
.send-confirm{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--accent)}
.send-confirm span{font-size:.88rem;color:var(--muted)}
.send-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.flagbar{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 45%,transparent)}
.flagbar svg{width:20px;height:20px;color:var(--danger);flex:none;margin-top:1px}
.flagbar b{display:block;color:var(--danger)}
.flagbar span{font-size:.9rem;color:var(--ink)}
.tile{position:relative;aspect-ratio:3/4;max-width:100%;width:100%;border-radius:10px;overflow:hidden;display:grid;place-items:center;padding:0}
.tile.empty{border:2px dashed var(--line);background:var(--surface);color:var(--accent);cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.tile.empty:hover{border-color:var(--accent);background:var(--accent-soft)}
.tile.empty:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.tile.empty.locked{cursor:default;color:var(--muted)}
.tile.empty.locked:hover{border-color:var(--line);background:var(--surface)}
.tile-cta{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:.85rem;padding:6px}
.tile-cta svg{width:28px;height:28px}
.tile.filled{border:1px solid var(--line);background:var(--sunken)}
.tile.filled img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile-meta{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font:500 .7rem/1.25 var(--f-mono);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile-flag{position:absolute;top:5px;left:5px;background:var(--warn);color:#fff;font:600 .62rem/1 var(--f-mono);letter-spacing:.04em;padding:4px 5px;border-radius:4px;text-transform:uppercase}
.viewer-top a{color:#fff;font:600 .75rem var(--f-mono);text-decoration:underline;text-underline-offset:2px}
.viewer-top .warn{color:#ffc27a}
.tile.busy{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

.submit{position:sticky;bottom:0;margin:8px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.submit-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.submit-note{font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.submit-note .num{white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.btn{border:0;border-radius:10px;padding:14px 16px;font-weight:600;font-size:1rem;background:var(--accent);color:var(--accent-ink);width:100%}
.btn:disabled{background:var(--sunken);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.xl{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--accent);color:var(--accent)}
.btn.xl svg{width:18px;height:18px}
.btn.xl:disabled{border-color:var(--line);color:var(--muted)}
.done-card{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ink)}
.done-card svg{width:26px;height:26px;color:var(--ok);flex:none}
.done-card small{display:block;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;margin-left:auto;white-space:nowrap}

/* Viewer */
.viewer{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer-top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px}
.viewer-top div{flex:1;min-width:0}
.viewer-top b{display:block;font:700 1.15rem/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.viewer-top span{font:500 .75rem var(--f-mono);opacity:.8}
.x{background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.x svg{width:20px;height:20px}
.viewer-img{flex:1;min-height:0;display:grid;place-items:center}
.viewer-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.viewer-act{display:flex;gap:10px;margin-top:12px;max-width:560px;width:100%;margin-inline:auto}
.viewer-act label,.viewer-act button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;border:0;border-radius:10px;padding:12px 8px;background:#fff;color:#111;font-weight:600;cursor:pointer;min-width:0}
.viewer-act svg{width:18px;height:18px;flex:none}
.viewer-act label,.viewer-act button{white-space:nowrap;font-size:.92rem;gap:6px}
.viewer-top span{display:block}
.viewer-top span span{display:inline}
.viewer-top a{display:inline-block;margin-top:3px}
.viewer-act .vdanger{background:#c62828;color:#fff}
.viewer-act .vghost{background:rgba(255,255,255,.14);color:#fff}
.viewer-act .vok{background:#1b7a3d;color:#fff}
.viewer-act .vretake{background:#ffb300;color:#111}
.viewer-act + .viewer-act{margin-top:8px}
.viewer-act.flagform{flex-wrap:wrap}
.viewer-act.flagform textarea{flex-basis:100%;border-radius:10px;border:0;padding:10px 12px;font:inherit;font-size:16px;resize:none;background:#fff;color:#111}
.reasons{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.viewer-act .reasons .reason{flex:none;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:6px 11px;font-size:.82rem;font-weight:500}
.rv-box{max-width:560px;width:100%;margin:10px auto 0;padding:10px 12px;border-radius:10px;color:#fff;display:flex;flex-direction:column;gap:3px}
.rv-box b{display:flex;align-items:center;gap:6px;font-weight:600}
.rv-box b svg{width:16px;height:16px}
.rv-box p{margin:0;font-size:.95rem;overflow-wrap:anywhere}
.rv-box small{font:500 .72rem var(--f-mono);opacity:.85}
.rv-box.flag{background:#c62828}
.rv-box.ok{background:rgba(27,122,61,.9)}
.rv-box.pend{background:rgba(255,255,255,.12)}
.viewer-act button:disabled{opacity:.6;cursor:default}
.viewer-confirm{flex-basis:100%;color:#fff;text-align:center;font-weight:600;margin-bottom:2px}
.viewer-act.confirm{flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.8rem}
.toast.err{background:var(--danger);color:#fff}
</style>

/* Monthly LK-1e workbook: one sheet per location, each sheet holding two copies of the
   template form stacked vertically (one printed page each). Works on the raw .xlsx parts
   so the template's formatting and cropped MBJB logo stay exactly as designed. */
async function buildLK1eMonth(JSZip, templateBytes, sheets) {
  // sheets = [{ name, lokasi, forms: [{ jenis, photos: [{bytes,w,h}|null x3] }, ...] }]
  const zip = await JSZip.loadAsync(templateBytes);
  const read = p => zip.file(p).async("string");
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const FORM_ROWS = 56, PX = 9525, ROW_PX = 13.95 * 96 / 72;

  const tpl = await read("xl/worksheets/sheet1.xml");
  const colW = {};
  for (const m of tpl.matchAll(/<col min="(\d+)" max="(\d+)" width="([\d.]+)"/g)) {
    const px = Math.trunc(((256 * +m[3] + Math.trunc(128 / 7)) / 256) * 7);
    for (let c = +m[1]; c <= Math.min(+m[2], 200); c++) colW[c] = px;
  }
  const BOX = { c1: 18, c2: 60, rows: [[9, 24], [25, 40], [41, 56]] };
  const cw = c => colW[c] || 64;
  let boxW = 0; for (let c = BOX.c1; c <= BOX.c2; c++) boxW += cw(c);

  // Wrapped copy of the LOKASI value style
  let styles = await read("xl/styles.xml");
  const xfCount = +styles.match(/<cellXfs count="(\d+)"/)[1];
  styles = styles.replace(/<cellXfs count="\d+">([\s\S]*?)<\/cellXfs>/, (a, inner) =>
    `<cellXfs count="${xfCount + 1}">${inner}<xf numFmtId="0" fontId="2" fillId="0" borderId="7" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top" wrapText="1"/></xf></cellXfs>`);
  zip.file("xl/styles.xml", styles);
  const WRAP = xfCount;

  // Split the template sheet into its parts
  const head = tpl.slice(0, tpl.indexOf("<sheetData>"));
  const rowsXml = tpl.slice(tpl.indexOf("<sheetData>") + 11, tpl.indexOf("</sheetData>"));
  const merges = [...tpl.matchAll(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"\/>/g)];
  const tailStart = tpl.indexOf("</mergeCells>") + 13;
  const tail = tpl.slice(tailStart);

  const shiftRows = (xml, off) => !off ? xml : xml
    .replace(/<row r="(\d+)"/g, (m, r) => `<row r="${+r + off}"`)
    .replace(/<c r="([A-Z]+)(\d+)"/g, (m, c, r) => `<c r="${c}${+r + off}"`);
  const text = (ref, s) => `<c r="${ref}" s="${WRAP}" t="inlineStr"><is><t xml:space="preserve">${esc(s)}</t></is></c>`;

  const drawingTpl = await read("xl/drawings/drawing1.xml");
  const logoAnchor = drawingTpl.match(/<xdr:twoCellAnchor>[\s\S]*<\/xdr:twoCellAnchor>/)[0];
  const drawingHead = drawingTpl.slice(0, drawingTpl.indexOf("<xdr:twoCellAnchor>"));
  const shiftAnchor = (a, off) => a.replace(/<xdr:row>(\d+)<\/xdr:row>/g, (m, r) => `<xdr:row>${+r + off}</xdr:row>`);

  function photoAnchor(boxIdx, off, p, picId, rid) {
    const [r1, r2] = BOX.rows[boxIdx];
    const boxH = (r2 - r1 + 1) * ROW_PX, pad = 6;
    const s = Math.min((boxW - pad * 2) / p.w, (boxH - pad * 2) / p.h);
    const w = Math.round(p.w * s), h = Math.round(p.h * s);
    let x = (boxW - w) / 2, col = BOX.c1;
    while (x >= cw(col) && col < BOX.c2) { x -= cw(col); col++; }
    let y = (boxH - h) / 2, row = r1;
    while (y >= ROW_PX && row < r2) { y -= ROW_PX; row++; }
    return `<xdr:oneCellAnchor><xdr:from><xdr:col>${col - 1}</xdr:col><xdr:colOff>${Math.round(x * PX)}</xdr:colOff><xdr:row>${row - 1 + off}</xdr:row><xdr:rowOff>${Math.round(y * PX)}</xdr:rowOff></xdr:from>` +
      `<xdr:ext cx="${w * PX}" cy="${h * PX}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${picId}" name="Foto ${picId}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>` +
      `<xdr:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${w * PX}" cy="${h * PX}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`;
  }

  zip.remove("xl/worksheets/sheet1.xml");
  zip.remove("xl/worksheets/_rels/sheet1.xml.rels");
  zip.remove("xl/drawings/drawing1.xml");
  zip.remove("xl/drawings/_rels/drawing1.xml.rels");

  const sheetEntries = [], relEntries = [], overrides = [], printAreas = [];
  let media = 0;
  sheets.forEach((sh, i) => {
    const n = i + 1, total = FORM_ROWS * sh.forms.length;
    let rows = "", mergeXml = "", anchors = "", rels = `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image1.jpeg"/>`;
    let picId = 2, ridN = 2;
    sh.forms.forEach((f, k) => {
      const off = k * FORM_ROWS;
      rows += shiftRows(rowsXml, off)
        .replace(new RegExp(`<c r="A${12 + off}" s="\\d+"/>`), text(`A${12 + off}`, sh.lokasi))
        .replace(new RegExp(`<c r="A${23 + off}" s="\\d+"/>`), text(`A${23 + off}`, f.jenis));
      for (const m of merges) {
        let r2 = +m[4];
        if (m[1] === "A" && +m[2] === 12 && r2 === 14) r2 = 19; // taller LOKASI box for long names
        mergeXml += `<mergeCell ref="${m[1]}${+m[2] + off}:${m[3]}${r2 + off}"/>`;
      }
      anchors += shiftAnchor(logoAnchor, off).replace(/<xdr:cNvPr id="\d+"/, `<xdr:cNvPr id="${picId++}"`);
      f.photos.forEach((p, b) => {
        if (!p) return;
        media++;
        const rid = `rId${ridN++}`;
        zip.file(`xl/media/foto${media}.jpeg`, p.bytes);
        rels += `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/foto${media}.jpeg"/>`;
        anchors += photoAnchor(b, off, p, picId++, rid);
      });
    });
    let h = head.replace(/<dimension ref="[^"]*"\/>/, `<dimension ref="A1:BK${total}"/>`);
    if (n > 1) h = h.replace(' tabSelected="1"', "");
    const breaks = sh.forms.length > 1
      ? `<rowBreaks count="${sh.forms.length - 1}" manualBreakCount="${sh.forms.length - 1}">${sh.forms.slice(1).map((_, k) => `<brk id="${(k + 1) * FORM_ROWS}" max="16383" man="1"/>`).join("")}</rowBreaks>` : "";
    const t = tail.replace(/<drawing r:id="rId\d+"\/>/, `${breaks}<drawing r:id="rId1"/>`);
    zip.file(`xl/worksheets/sheet${n}.xml`, `${h}<sheetData>${rows}</sheetData><mergeCells count="${merges.length * sh.forms.length}">${mergeXml}</mergeCells>${t}`);
    zip.file(`xl/worksheets/_rels/sheet${n}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${n}.xml"/></Relationships>`);
    zip.file(`xl/drawings/drawing${n}.xml`, `${drawingHead}${anchors}</xdr:wsDr>`);
    zip.file(`xl/drawings/_rels/drawing${n}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`);
    sheetEntries.push(`<sheet name="${esc(sh.name)}" sheetId="${n}" r:id="rIdS${n}"/>`);
    relEntries.push(`<Relationship Id="rIdS${n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${n}.xml"/>`);
    overrides.push(`<Override PartName="/xl/worksheets/sheet${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/drawings/drawing${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);
    printAreas.push(`<definedName name="_xlnm.Print_Area" localSheetId="${i}">'${esc(sh.name.replace(/'/g, "''"))}'!$A$1:$BK$${total}</definedName>`);
  });

  let wb = await read("xl/workbook.xml");
  wb = wb.replace(/<sheets>[\s\S]*?<\/sheets>/, `<sheets>${sheetEntries.join("")}</sheets>`)
         .replace(/<definedNames>[\s\S]*?<\/definedNames>/, `<definedNames>${printAreas.join("")}</definedNames>`);
  zip.file("xl/workbook.xml", wb);
  let wbRels = await read("xl/_rels/workbook.xml.rels");
  wbRels = wbRels.replace(/<Relationship Id="rId\d+" Type="[^"]+\/worksheet" Target="worksheets\/sheet1.xml"\/>/, relEntries.join(""));
  zip.file("xl/_rels/workbook.xml.rels", wbRels);
  let ct = await read("[Content_Types].xml");
  ct = ct.replace('<Default Extension="JPG" ContentType="image/.jpg"/>', "")
         .replace(/<Override PartName="\/xl\/worksheets\/sheet1.xml"[^>]*\/>/, "")
         .replace(/<Override PartName="\/xl\/drawings\/drawing1.xml"[^>]*\/>/, "")
         .replace("</Types>", overrides.join("") + "</Types>");
  zip.file("[Content_Types].xml", ct);
  let app = await read("docProps/app.xml");
  app = app.replace(/<vt:i4>\d+<\/vt:i4>/, `<vt:i4>${sheets.length}</vt:i4>`)
           .replace(/<TitlesOfParts>[\s\S]*<\/TitlesOfParts>/, `<TitlesOfParts><vt:vector size="${sheets.length}" baseType="lpstr">${sheets.map(s => `<vt:lpstr>${esc(s.name)}</vt:lpstr>`).join("")}</vt:vector></TitlesOfParts>`);
  zip.file("docProps/app.xml", app);
  return zip.generateAsync({ type: "uint8array", compression: "DEFLATE", compressionOptions: { level: 6 } });
}

/* Sheet names from street names: Excel allows 31 characters and no \ / ? * [ ] : ,
   and names must be unique (case-insensitive). Streets used by more than one pond get
   the kolam number added, e.g. "Persiaran Setia Tropika K10". */
function lk1eSheetNames(locs) {
  const clean = s => s.replace(/[\\/?*\[\]:]/g, "-").replace(/^'+|'+$/g, "").replace(/\s+/g, " ").trim();
  const count = {};
  locs.forEach(l => { const k = clean(l.j).toLowerCase(); count[k] = (count[k] || 0) + 1; });
  const used = new Set();
  return locs.map(l => {
    const street = clean(l.j);
    const k = clean(l.k.replace(/^Kolam\s*/i, ""));
    const suffix = count[street.toLowerCase()] > 1 ? (/^\d/.test(k) ? " K" + k : " " + k) : "";
    let name = street.slice(0, 31 - suffix.length).trim() + suffix;
    let base = name, i = 2;
    while (used.has(name.toLowerCase())) { const sfx = ` (${i++})`; name = base.slice(0, 31 - sfx.length).trim() + sfx; }
    used.add(name.toLowerCase());
    return name;
  });
}

// Photos live in a private bucket; the app shows them through short-lived signed links.
const urlCache=new Map();
const cachedUrl=p=>{ const c=urlCache.get(p); return c&&c.exp>Date.now()?c.url:""; };
async function signedUrls(paths){
  const now=Date.now(), need=[...new Set(paths)].filter(p=>p&&!cachedUrl(p));
  for(let i=0;i<need.length;i+=100){
    const {data,error}=await sb.storage.from(BUCKET).createSignedUrls(need.slice(i,i+100),3600);
    if(error) throw error;
    (data||[]).forEach(d=>{ if(d.signedUrl) urlCache.set(d.path,{url:d.signedUrl,exp:now+50*60*1000}); });
  }
}

  const imgs=[...root.querySelectorAll("img[data-path]")].filter(i=>!i.getAttribute("src"));
  if(!imgs.length||!sb) return;
  try{ await signedUrls(imgs.map(i=>i.dataset.path)); imgs.forEach(i=>{ const u=cachedUrl(i.dataset.path); if(u) i.src=u; }); }catch{}
}

  const m={takenAt:null,lat:null,lng:null};
  try{
    if(window.exifr){
      const r=await window.exifr.parse(file,{tiff:true,exif:true,gps:true,ifd1:false,xmp:false,icc:false,iptc:false,jfif:false,ihdr:false});
      const d=r?.DateTimeOriginal||r?.CreateDate;
      if(d instanceof Date && !isNaN(d)) m.takenAt=d.toISOString();
      if(Number.isFinite(r?.latitude)&&Number.isFinite(r?.longitude)&&!(r.latitude===0&&r.longitude===0)){m.lat=+r.latitude.toFixed(6);m.lng=+r.longitude.toFixed(6)}
    }
  }catch{}
  return m;
}
function fmtSize(n){return n>=1073741824?`${(n/1073741824).toFixed(2)} GB`:fmtBytes(n)}
function fmtBytes(n){const mb=n/1048576;return `${mb>=0.1?mb.toFixed(1):Math.max(mb,0.01).toFixed(2)} MB`}
// The phone's current location at upload time. Resolves null when the browser refuses
// (for example on an http page or an old browser), the user says no, or no fix in time.
function currentPosition(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    let done=false; const finish=v=>{ if(!done){ done=true; clearTimeout(t); res(v); } };
    const t=setTimeout(()=>finish(null),12000);
    try{
      navigator.geolocation.getCurrentPosition(
        p=>finish({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0)}),
        ()=>finish(null),
        {enableHighAccuracy:true,timeout:10000,maximumAge:30000});
    }catch{ finish(null); }
  });
}
const gpsLabel=src=>src==="telefon"?"lokasi telefon":"dari foto";
const mapsUrl=p=>`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
function fmtDay(iso){try{return new Date(iso).toLocaleDateString("ms-MY",{day:"numeric",month:"short"})}catch{return""}}
function renderMonth(){document.getElementById("mname").textContent=fmtMonth(state.month);document.getElementById("mnext").disabled=state.month>=thisMonth()}
function photo(r,t,s){return r?.photos?.[t]?.[s]?.asset ? r.photos[t][s] : null}
// How many times this slot has been uploaded this month (photos from before the counter count as 1).
// A deleted slot keeps its count, so deleting and retaking still counts up.
function uploadsOf(r,t,s){const e=r?.photos?.[t]?.[s];return Number(e?.uploads)||(e?.asset?1:0)}

const reportedAt=r=>r?.reportAt||r?.submittedAt||null;
function countAll(r){let n=0;for(const [t,s] of ALL_SLOTS)if(photo(r,t,s))n++;return n}
// One photo slot: none (no photo), draft (uploaded, not yet sent with Hantar), pend (sent, belum disemak),
// ok (disahkan), flag (ditolak). Admins only check photos that were sent.
const sentOf=locId=>state.reports[locId]?.sent||null;
function check(locId,t,s){
  const p=photo(state.reports[locId],t,s); if(!p) return {st:"none"};
  const rv=state.reviews[locId]?.[t]?.[s];
  if(rv&&rv.asset===p.asset) return {st:rv.state==="flag"?"flag":"ok",rv,p};
  const prev=rv&&rv.state==="flag"?rv:null; // a retaken photo needs sending and checking again
  return {st:sentOf(locId)?.assets?.[t]?.[s]===p.asset?"pend":"draft",p,prev};
}
function tally(locId){ const c={up:0,ok:0,flag:0,pend:0,draft:0}; for(const [t,s] of ALL_SLOTS){ const x=check(locId,t,s).st; if(x!=="none"){c.up++;c[x]++;} } return c; }
function status(locId){
  const r=state.reports[locId], c=tally(locId);
  if(c.flag) return "fix";
  if(reportedAt(r)) return state.isAdmin?"done":"ready"; // workers never see report state
  if(c.ok===ALL_TOTAL) return "ready";
  if(c.up===ALL_TOTAL) return c.draft?"unsent":"check";
  return c.up?"prog":"none";
}
// Workers may change a photo only until it is sent, or when the admin rejects it (the database enforces the same)
const canChange=(locId,t,s)=>state.isAdmin||["none","draft","flag"].includes(check(locId,t,s).st);

const nextPending=(locId,t,s)=>{ const i=ALL_SLOTS.findIndex(([a,b])=>a===t&&b===s);
  for(let k=1;k<=ALL_SLOTS.length;k++){ const [a,b]=ALL_SLOTS[(i+k)%ALL_SLOTS.length]; if(check(locId,a,b).st==="pend") return [a,b]; } return null; };
const reviewErrMsg=e=>/photo_reviews|42P01|PGRST20/i.test(`${e?.code||""} ${e?.message||""}`)?"Semakan foto belum disediakan. Jalankan photo_reviews.sql dalam Supabase.":/row-level|42501|permission/i.test(e?.message||"")?"Hanya admin boleh menyemak foto.":"Tidak dapat disimpan. Semak sambungan dan cuba lagi.";

function subscribeMonth(){
  if(unsub){unsub();unsub=null}
  state.reports={}; state.reviews={}; state.loaded=false;
  if(!sb||!state.me) return;
  const month=state.month;
  const load=async()=>{ try{
    const [m,rv]=await Promise.all([loadMonthReports(month),loadMonthReviews(month).catch(e=>({__err:e}))]);
    if(state.month!==month) return;
    state.reports=m; state.reviewErr=!!rv.__err; if(!rv.__err) state.reviews=rv; state.loaded=true; refresh();
  }catch(e){} };
  load();
  let ch=null;
  try{
    ch=sb.channel("reports-"+month+"-"+Date.now())
      .on("postgres_changes",{event:"*",schema:"public",table:"reports",filter:`month=eq.${month}`},p=>{
        if(state.month!==month) return;
        if(p.eventType==="DELETE"){ if(p.old?.loc_id) delete state.reports[p.old.loc_id]; else return load(); }
        else if(p.new?.loc_id) state.reports[p.new.loc_id]=p.new.doc||{};
        refresh();
      })
      .on("postgres_changes",{event:"*",schema:"public",table:"photo_reviews",filter:`month=eq.${month}`},p=>{
        if(state.month!==month) return;
        if(p.eventType==="DELETE"){ const o=p.old; if(o?.loc_id&&o.task&&o.slot&&state.reviews[o.loc_id]?.[o.task]) delete state.reviews[o.loc_id][o.task][o.slot]; else return load(); }
        else if(p.new?.loc_id) putReview(state.reviews,p.new);
        refresh();
      }).subscribe();
  }catch{}
  const t=setInterval(load,60000);   // safety net if live updates drop
  unsub=()=>{ clearInterval(t); if(ch) try{ sb.removeChannel(ch); }catch{} };
}
const chains={};
function serial(key,fn){const p=(chains[key]||Promise.resolve()).catch(()=>{}).then(fn);chains[key]=p;return p}

async function stampImage(file,loc,taskLabel,stageLabel,meta){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("decode"));i.src=url});
    meta.width=img.naturalWidth; meta.height=img.naturalHeight; meta.bytes=file.size;
    // Fit inside 1000 x 1200 px (width x height), keeping proportions; never enlarge
    const MAX_W=1000, MAX_H=1200, s=Math.min(1,MAX_W/img.naturalWidth,MAX_H/img.naturalHeight);
    const w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    const g=c.getContext("2d"); g.drawImage(img,0,0,w,h);
    const fs=Math.max(13,Math.round(Math.min(w,h)/34)), pad=Math.round(fs*.6), lh=Math.round(fs*1.3);
    const lines=[
      loc.n,
      `${taskLabel.toUpperCase()} · ${stageLabel.toUpperCase()}`,
      `Tarikh (telefon): ${fmtStamp(new Date(meta.takenAt))} · Muatnaik ${meta.uploads}`,
      meta.lat!=null ? `GPS (${gpsLabel(meta.gpsSource)}): ${meta.lat.toFixed(6)}, ${meta.lng.toFixed(6)}${meta.gpsAcc?` ±${meta.gpsAcc} m`:""}` : `GPS: tiada (lokasi telefon tidak dibenarkan, foto tiada GPS)`
    ];
    const bh=pad*2+lh*lines.length;
    g.fillStyle="rgba(0,0,0,0.58)"; g.fillRect(0,h-bh,w,bh);
    g.fillStyle="#ffffff"; g.textBaseline="top";
    lines.forEach((t,i)=>{
      g.font=`${i===0?600:500} ${fs}px system-ui, sans-serif`;
      let txt=t; while(g.measureText(txt).width>w-pad*2 && txt.length>4) txt=txt.slice(0,-2);
      if(txt!==t) txt=txt.slice(0,-1)+"…";
      g.fillText(txt,pad,h-bh+pad+i*lh);
    });
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.82));
  } finally { URL.revokeObjectURL(url); }
}

async function handleUpload(task,stage,file){
  const loc=byId[state.locId]; if(!loc||!file) return;
  if(!file.type.startsWith("image/")){toast("Sila pilih fail gambar.",true);return}
  const key=`${loc.id}|${task}|${stage}`; if(state.busy[key]) return;
  if(!canChange(loc.id,task,stage)){ toast("Foto ini telah dihantar dan tidak boleh ditukar.",true); return; }
  const prev=photo(state.reports[loc.id],task,stage)?.asset;
  const uploads=uploadsOf(state.reports[loc.id],task,stage)+1;
  const T=secOf(task), S=slotOf(task,stage);
  state.busy[key]=true; closeViewer(); refresh();
  try{
    const now=new Date();   // date/time comes from the phone's own clock at upload
    const [meta,live]=await Promise.all([readMeta(file),currentPosition()]);
    meta.exifAt=meta.takenAt; meta.takenAt=now.toISOString(); meta.uploads=uploads;
    if(live){ meta.lat=live.lat; meta.lng=live.lng; meta.gpsSource="telefon"; meta.gpsAcc=live.acc; }
    else if(meta.lat!=null){ meta.gpsSource="foto"; meta.gpsAcc=null; }
    const blob=await stampImage(file,loc,T.label,S.label,meta);
    const res=await assets.upload(blob,{path:`${state.month}/${loc.id}/${task}-${stage}-${Date.now()}.jpg`});
    await writePhoto(loc,task,stage,{asset:res.id,uploads,by:uid,user:state.me?.username||null,at:new Date().toISOString(),takenAt:meta.takenAt,exifAt:meta.exifAt||null,dateSource:"telefon",lat:meta.lat,lng:meta.lng,gpsSource:meta.gpsSource||null,gpsAcc:meta.gpsAcc??null,width:meta.width,height:meta.height,bytes:meta.bytes});
    if(prev && prev!==res.id) assets.delete(prev).catch(()=>{});
    const noGps=meta.lat==null;
    if(noGps) toast("Disimpan, tetapi lokasi GPS tidak dapat dibaca. Benarkan akses lokasi untuk aplikasi ini dalam pelayar.",true);
    else if(thisMonth(now)!==state.month) toast(`Disimpan. Perhatian: tarikh telefon ${fmtStamp(now)} bukan dalam bulan ${fmtMonth(state.month)}.`,true);
    else toast(`${T.label} · ${S.label} disimpan`);
  }catch(e){
    const c=e?.code;
    toast(c==="too_large"?"Gambar terlalu besar.":c==="rate_limited"||c==="resource_exhausted"?"Terlalu banyak muat naik. Cuba lagi sebentar.":c==="quota_or_state"||c==="quota_exceeded"?"Ruang simpanan penuh. Hubungi pengurus projek.":e?.message==="decode"?"Gambar tidak dapat dibaca. Cuba format JPG.":/dihantar/i.test(e?.message||"")?"Foto ini telah dihantar dan tidak boleh ditukar.":"Muat naik gagal. Semak sambungan dan cuba lagi.",true);
  }finally{ delete state.busy[key]; refresh(); }
}

async function downloadKolamPhotos(){

  if(!downloads||!window.JSZip){ toast("Muat turun tidak tersedia di sini.",true); return; }
  const loc=byId[state.locId], month=state.month, r=state.reports[loc.id];

  const items=[]; for(const t of SECTIONS) for(const sl of t.slots){ const p=photo(r,t.key,sl.key); if(p) items.push({t,sl,p}); }
  if(!items.length) return;
  state.zipping={done:0,total:items.length}; renderLoc();
  try{

      const res=await fetchPhoto(it.p.asset);

      state.zipping.done++; renderLoc();

    const c=e?.code;
    if(c==="declined"){}

state.export=null; // {done,total,phase}
/* LK-1e for a date range: only admin-approved (Sahkan) Sebelum/Semasa/Selepas photos whose
   phone date falls inside the range, from whichever monthly records the range covers. */
const BLN3=["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
const ymd=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const dmy=s=>{const [y,m,d]=s.split("-");return `${d}/${m}/${y}`};
const photoDay=p=>{try{return ymd(new Date(p.takenAt||p.at))}catch{return ""}};
function monthRange(m){const [y,mo]=m.split("-").map(Number);const last=ymd(new Date(y,mo,0)), today=ymd(new Date());return {from:`${m}-01`,to:last<today?last:today}}
function monthsBetween(from,to){const out=[];let m=from.slice(0,7);const end=to.slice(0,7);while(m<=end&&out.length<120){out.push(m);m=shiftMonth(m,1)}return out}
function syncRange(){ // follow the month picker until the admin picks their own dates
  const r=state.range;
  if(!r||(!r.touched&&r.forMonth!==state.month)) state.range={...monthRange(state.month),forMonth:state.month,touched:false};
  return state.range;
}
state.rcache={}; // month -> {reports,reviews,at}
state.noteDraft={}; // "month|locId" -> unsaved remark text
async function monthData(m,fresh){
  if(m===state.month&&state.loaded&&!state.reviewErr) return {reports:state.reports,reviews:state.reviews};
  const c=state.rcache[m]; if(c&&!fresh&&Date.now()-c.at<120000) return c;
  const [reports,reviews]=await Promise.all([loadMonthReports(m),loadMonthReviews(m)]);
  return state.rcache[m]={reports,reviews,at:Date.now()};
}
function rangePlan(from,to,data){ // data: {month:{reports,reviews}}
  const months=Object.keys(data).sort(), out=[]; let left=0, photos=0;
  for(const m of months){
    const {reports,reviews}=data[m];
    for(const l of LOCS){
      const r=reports[l.id]; if(!r?.photos) continue;
      const forms=TASKS.map(t=>({jenis:t.label.toUpperCase(),photos:[null,null,null]})); let n=0;
      TASKS.forEach((t,ti)=>STAGES.forEach((st,si)=>{
        const p=photo(r,t.key,st.key); if(!p) return;
        const d=photoDay(p); if(!d||d<from||d>to) return;
        const rv=reviews[l.id]?.[t.key]?.[st.key];
        if(rv&&rv.asset===p.asset&&rv.state==="ok"){ forms[ti].photos[si]=p.asset; n++; } else left++;
      }));
      if(n){ out.push({m,l,forms}); photos+=n; }
    }
  }
  return {sheets:out,photos,left,locs:new Set(out.map(x=>x.l.id)).size,multi:new Set(out.map(x=>x.m)).size>1};
}
function sheetNamesFor(plan){
  const used=new Set();
  return plan.sheets.map(({m,l})=>{
    const base=SHEET_NAMES[l.id], sfx=plan.multi?` ${BLN3[+m.slice(5)-1]}${m.slice(2,4)}`:"";
    let name=base.slice(0,31-sfx.length).trim()+sfx, b=name, i=2;
    while(used.has(name.toLowerCase())){ const x=` (${i++})`; name=b.slice(0,31-x.length).trim()+x; }
    used.add(name.toLowerCase()); return name;
  });
}
let rangeSeq=0;
async function refreshRangePlan(){
  const r=syncRange(), seq=++rangeSeq;
  if(!r.from||!r.to||r.from>r.to){ state.rplan={err:!r.from||!r.to?"Pilih tarikh mula dan tarikh akhir.":"Tarikh mula mesti sebelum tarikh akhir."}; return renderExport(); }
  const months=monthsBetween(r.from,r.to);
  if(months.length>24){ state.rplan={err:"Julat terlalu panjang. Pilih paling lama 24 bulan."}; return renderExport(); }
  state.rplan={loading:true}; renderExport();
  try{
    const data={}; for(const m of months) data[m]=await monthData(m);
    if(seq!==rangeSeq) return;

async function excelPhoto(id){
  const bm=await createImageBitmap(await fetchPhoto(id));
  // Fit the LK-1e photo box (about 2x its printed size) to keep the file manageable
  const s=Math.min(1,720/bm.width,520/bm.height), w=Math.round(bm.width*s), h=Math.round(bm.height*s);
  const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(bm,0,0,w,h); if(bm.close) bm.close();
  const blob=await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no({code:"encode"}),"image/jpeg",0.75));
  return {bytes:new Uint8Array(await blob.arrayBuffer()),w,h};
}
async function exportRange(){
  if(state.export||!state.isAdmin) return;
  if(!window.JSZip){toast("Komponen Excel gagal dimuatkan. Muat semula halaman.",true);return}
  const {from,to}=syncRange(); if(!from||!to||from>to) return;
  state.export={done:0,total:0,phase:"load"}; renderExport();
  try{
    const data={}; for(const m of monthsBetween(from,to)) data[m]=await monthData(m,true); // fresh copy of every month
    const plan=rangePlan(from,to,data);
    if(!plan.sheets.length){ toast("Tiada foto disahkan dalam julat tarikh ini.",true); return; }
    const names=sheetNamesFor(plan);
    const sheets=plan.sheets.map(({m,l},i)=>({name:names[i],lokasi:`${l.t}\n${l.j}\n${l.k}${plan.multi?`\n(${fmtMonth(m)})`:""}`,
      forms:TASKS.map(t=>({jenis:t.label.toUpperCase(),photos:[null,null,null]}))}));
    const tasks=[]; plan.sheets.forEach((sh,i)=>sh.forms.forEach((f,ti)=>f.photos.forEach((id,si)=>{ if(id) tasks.push([i,ti,si,id]); })));
    Object.assign(state.export,{total:tasks.length,phase:"fetch"}); renderExport();
    let next=0;
    const worker=async()=>{ while(next<tasks.length){ const [i,ti,si,id]=tasks[next++];
      sheets[i].forms[ti].photos[si]=await excelPhoto(id); state.export.done++; renderExport(); } };
    await Promise.all([worker(),worker(),worker(),worker()]);
    state.export.phase="build"; renderExport();
    const tpl=Uint8Array.from(atob(LK1E_TPL),c=>c.charCodeAt(0));
    const bytes=await buildLK1eMonth(JSZip,tpl,sheets);
    const whole=Object.keys(data).length===1&&from===`${from.slice(0,7)}-01`&&to===ymd(new Date(+from.slice(0,4),+from.slice(5,7),0));
    const label=whole?fmtMonth(from.slice(0,7)):`${dmy(from).replace(/\//g,".")} hingga ${dmy(to).replace(/\//g,".")}`;
    await downloads.save({filename:`LK-1e Kolam Takungan - ${label}.xlsx`,data:new Blob([bytes])});

  }catch(e){
    const c=e?.code;
    if(c==="declined"){}

    else if(c==="extension_not_enabled"||c==="rejected_extension") toast("Muat turun fail Excel tidak dibenarkan di sini.",true);
    else if(c==="fetch") toast("Sebahagian foto tidak dapat dimuatkan. Semak sambungan dan cuba lagi.",true);
    else toast("Excel tidak dapat disediakan. Cuba lagi.",true);
  }finally{ state.export=null; state.rplan=null; renderExport(); }

// App-level accounts: users/{username} = {name, salt, hash, createdAt}. Passwords are hashed with PBKDF2.
let usersMap={}, unsubUsers=null;
const SESSION_KEY="fkk-session";
const b64e=u=>btoa(String.fromCharCode(...u));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(salt),iterations:150000,hash:"SHA-256"},key,256);
  return b64e(new Uint8Array(bits));
}

// Live "at least 6 characters" check under a password field
const PW_MIN=6;
function pwHint(id){return `<small class="pw-hint" id="${id}-hint" aria-live="polite"></small>`}
function updatePwHint(input){
  const h=document.getElementById(input.id+"-hint"); if(!h) return;
  const n=input.value.length;
  if(input.dataset.match){
    const other=document.getElementById(input.dataset.match).value;
    h.className="pw-hint"+(n?(input.value===other?" ok":" bad"):"");
    h.textContent=!n?"Taip semula kata laluan yang sama.":input.value===other?"✓ Kata laluan sepadan":"✗ Belum sepadan";
    return;
  }
  h.className="pw-hint"+(n>=PW_MIN?" ok":n?" bad":"");
  h.innerHTML=n>=PW_MIN?`✓ Sekurang-kurangnya ${PW_MIN} aksara <b>(${n})</b>`:`Sekurang-kurangnya ${PW_MIN} aksara <b>(${n}/${PW_MIN})</b>`;
  const conf=document.querySelector(`[data-match="${input.id}"]`); if(conf) updatePwHint(conf);
}
function initPwHints(root=document){root.querySelectorAll("input[type=password]").forEach(updatePwHint)}
document.addEventListener("input",e=>{ if(e.target.type==="password"){ updatePwHint(e.target); for(const id of ["a-err","c-err"]){const er=document.getElementById(id); if(er) er.textContent="";} } });

async function submitNewUser(){
  const err=document.getElementById("n-err"), btn=document.getElementById("n-go");
  const display=document.getElementById("n-user").value.trim(), u=normUser(display), role=document.getElementById("n-role").value==="admin"?"admin":"worker", pw=document.getElementById("n-pass").value;
  const fail=m=>{err.textContent=m;btn.disabled=false;btn.textContent="Tambah pengguna"};
  err.textContent="";
  if(!validUser(u)) return fail("Nama pengguna mesti 3–30 aksara: huruf, nombor, titik atau sengkang.");
  if(pw.length<PW_MIN) return fail(`Kata laluan mesti sekurang-kurangnya ${PW_MIN} aksara.`);
  btn.disabled=true; btn.textContent="Menyimpan…";
  try{
    if(usersMap[u]) return fail("Nama pengguna ini sudah digunakan.");
    // Create the login with a separate client so the admin stays signed in
    const tmp=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"fkk-tmp"}});
    const {data,error}=await tmp.auth.signUp({email:emailOf(u),password:pw,options:{data:{display,created_by:state.me?.username||""}}});
    if(error) return fail(/registered|exists/i.test(error.message||"")?"Nama pengguna ini sudah digunakan.":`Akaun tidak dapat dicipta: ${error.message}`);
    if(!data?.user?.id||(Array.isArray(data.user.identities)&&!data.user.identities.length)) return fail("Nama pengguna ini sudah digunakan.");
    await rpc("admin_activate_user",{p_user:data.user.id,p_role:role,p_display:display});
    try{ await tmp.auth.signOut(); }catch{}
    await loadUsers();
    ["n-user","n-pass"].forEach(id=>{const el=document.getElementById(id); if(el) el.value="";});
    const rl=document.getElementById("n-role"); if(rl) rl.value="worker";
    renderAdmin(); toast(`Pengguna ${display} (${role==="admin"?"Admin":"Pekerja"}) ditambah. Beritahu mereka kata laluan sementara.`);
  }catch(e){ fail("Tidak dapat menyimpan. Cuba lagi."); }
}

async function deleteUser(u){

  const err=document.getElementById("a-err"), btn=document.getElementById("a-go");

const scr=()=>document.getElementById("screen");
function go(screen,opts={}){
  if(screen==="admin" && !state.isAdmin && !state.isOwner) screen=state.me?"zones":"auth";
  if(!["auth","admin"].includes(screen) && !state.me) screen="auth";
  if(state.me?.mustChange && screen!=="admin") { screen="pwchange"; opts={...opts,forced:true}; }
  if(screen==="admin"){ state.adminEdit=null; state.adminDel=null; subscribeUsers(); setTimeout(()=>{ if(db) loadAdminMonth(); loadStorage(); },0); }
  Object.assign(state,{screen},opts); state.sendConfirm=false; state.delAsk=null;
  closeViewer();
  document.getElementById("datebox").hidden = ["auth","admin","pwchange"].includes(screen);
  document.getElementById("topbrand").hidden = !["auth","zones"].includes(screen);
  if(screen==="auth") renderAuth();

  if(screen==="admin") renderAdmin();

}

function zoneStats(z){
  const locs=LOCS.filter(l=>l.z===z), s={total:locs.length,done:0,ready:0,prog:0,fix:0,pend:0,pendLoc:0,flag:0,unsent:0};
  for(const l of locs){
    const st=status(l.id), c=tally(l.id);
    if(st==="done")s.done++; else if(st==="ready")s.ready++; else if(st==="fix")s.fix++; else if(st!=="none")s.prog++;
    s.flag+=c.flag; s.pend+=c.pend; if(c.pend)s.pendLoc++; if(st==="unsent")s.unsent++;
  }
  return s;
}

    const alerts=[s.fix?`<span class="za za-fix">${ICON.flag}<span class="num">${s.fix}</span> kolam perlu ambil semula</span>`:"",
      s.unsent?`<span class="za za-unsent"><span class="num">${s.unsent}</span> kolam belum dihantar</span>`:"",
      s.pend?`<span class="za za-pend"><span class="num">${s.pend}</span> foto belum disemak</span>`:""].join("");
    m.innerHTML=`<span class="num">${s.total}</span> kolam · ${state.isAdmin?`<span class="num">${s.done}</span> laporan dicipta · `:""}<span class="num">${s.ready}</span> lengkap · <span class="num">${s.prog}</span> dalam proses${alerts?`<span class="zalerts">${alerts}</span>`:""}`;
    const w=n=>`${n/s.total*100}%`;

  }
  renderTodo();
  renderExport();
}
// "Perlu tindakan": rejected photos for everyone, the review queue for admins
function renderTodo(){
  const el=document.getElementById("todo"); if(!el) return;
  if(!state.loaded){ el.innerHTML=""; return; }
  const flagged=LOCS.map(l=>({l,c:tally(l.id)})).filter(x=>x.c.flag);
  const MAX=25;
  const firstNote=l=>{ for(const [t,s] of ALL_SLOTS){ const c=check(l.id,t,s); if(c.st==="flag") return [`${secOf(t).label} · ${slotOf(t,s).label}`,c.rv.note]; } return null; };
  const flagRows=flagged.slice(0,MAX).map(({l,c})=>`<button class="trow" data-loc="${l.id}" data-z="${l.z}">
      <span class="trow-main"><span class="row-t">${esc(l.t)}</span><span class="row-s">Zon ${l.z} · ${esc(l.j)} · ${esc(l.k)}</span>${(n=>n?`<span class="trow-note"><b>${esc(n[0])}:</b> ${esc(n[1])}</span>`:"")(firstNote(l))}</span>
      <span class="pill p-fix">${c.flag} ditolak</span></button>`).join("");
  let html=`<div class="todo-h">${ICON.flag}<h2>Foto ditolak</h2><span class="num">${flagged.reduce((a,x)=>a+x.c.flag,0)}</span></div>`;
  html+=flagged.length?`<div class="tlist">${flagRows}${flagged.length>MAX?`<div class="tmore">+${flagged.length-MAX} kolam lagi. Buka zon dan pilih “Ditolak”.</div>`:""}</div>`
    :`<div class="okline">✓ Tiada foto ditolak bulan ini.</div>`;
  if(state.isAdmin){
    const q=["A","B"].map(z=>({z,...zoneStats(z)}));
    const total=q.reduce((a,x)=>a+x.pend,0);
    html+=`<div class="todo-h sub"><h2>Menunggu semakan admin</h2><span class="num">${total}</span></div>`;
    html+=total?`<div class="qbtns">${q.filter(x=>x.pend).map(x=>`<button class="qbtn" data-zone="${x.z}" data-f="pend"><b>Zon ${x.z}</b><span><span class="num">${x.pend}</span> foto · <span class="num">${x.pendLoc}</span> kolam</span>${ICON.chev}</button>`).join("")}</div>`
      :`<div class="okline">✓ Semua foto yang dimuat naik sudah disemak.</div>`;
  }
  el.innerHTML=html;
}

function updateList(){

  const info=Object.fromEntries(locs.map(l=>[l.id,{s:status(l.id),c:tally(l.id)}]));
  const match=(k,x)=>k==="all"||(k==="pend"?x.c.pend>0:k==="prog"?["prog","check","unsent"].includes(x.s):x.s===k);
  const chips=[["all","Semua"],["fix","Ditolak"],["pend","Belum disemak"],["unsent","Belum dihantar"],["none","Belum mula"],["prog","Dalam proses"],["ready","Lengkap"],...(state.isAdmin?[["done","Laporan dicipta"]]:[])];

      <span class="row-side">${pill(s)}${extra}${dots(l.id)}</span></button>`}).join("")
