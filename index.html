function renderLoc(){
  const loc=byId[state.locId]; if(!loc) return go("zones");
  const r=state.reports[loc.id], st=status(loc.id), ct=tally(loc.id), can=editable(r);
  const tasks=SECTIONS.map((t,i)=>{
    const c=t.slots.filter(s=>photo(r,t.key,s.key)).length, N=t.slots.length, allOk=t.slots.every(s=>check(loc.id,t.key,s.key).st==="ok");
    const divider=i===TASKS.length?`<div class="extra-h"><b>Gambar tapak</b>${state.isAdmin?`<span>Tidak dimasukkan dalam laporan LK-1e</span>`:""}</div>`:"";
    return `${divider}<section class="task${t.report?"":" extra"}"><div class="task-h"><h2>${t.label}</h2><span class="cnt${allOk?" full":""}">${c}/${N} foto</span></div>
      <div class="tiles${t.wide?" tiles-4":""}">${t.slots.map(s=>tile(loc,r,t,s,can&&canChange(loc.id,t.key,s.key))).join("")}</div></section>`}).join("");
  const nAll=ct.up, z=state.zipping;
  const rep=reportedAt(r), canMake=ct.ok===ALL_TOTAL&&!!downloads&&!state.making;
  const sn=sentOf(loc.id), sendOk=canSend(ct);
  const need=nAll<ALL_TOTAL?`Muat naik semua ${ALL_TOTAL} foto, kemudian tekan Hantar.`:ct.flag?`Ambil semula ${ct.flag} foto yang ditolak, kemudian tekan Hantar.`:ct.draft?`Tekan Hantar untuk hantar foto kepada admin.`:ct.pend?`${ct.pend} foto menunggu semakan admin.`:"Semua foto disahkan.";
  let foot=rep&&state.isAdmin?`<div class="done-card">${ICON.check}<div><b>Laporan LK-1e dicipta</b><small>${fmtStamp(new Date(rep))} · <span data-uid="" data-user="${esc(r.reportUser||r.submittedUser||"")}"></span></small></div></div>`
    :`<div class="submit-note"><span>${need}</span><span class="num" title="disahkan / jumlah">${ct.ok}/${ALL_TOTAL} disahkan</span></div>`;
  if(can&&(!state.isAdmin||sendOk)){
    const lbl=sn?"Hantar semula":"Hantar";
    foot+=state.sendConfirm&&sendOk&&!state.sending
      ?`<div class="send-confirm"><b>Hantar ${ct.draft} foto kepada admin?</b><span>Selepas dihantar, foto tidak boleh ditukar kecuali ditolak oleh admin.</span>
          <div class="send-btns"><button class="btn ghost" data-act="sendno">Batal</button><button class="btn send" data-act="sendyes">${ICON.send}Hantar</button></div></div>`
      :`<button class="btn send" data-act="send" ${sendOk&&!state.sending?"":"disabled"}>${ICON.send}${state.sending?"Menghantar…":lbl}</button>`;
  }
  if(state.isAdmin) foot+=`<button class="btn" data-act="mkreport" ${canMake?"":"disabled"}>${state.making?"Mencipta laporan…":rep?"Cipta semula laporan":"Cipta Laporan"}</button>`;
  if(downloads&&state.isAdmin) foot+=`<button class="btn xl" data-act="kzip" ${z||!nAll?"disabled":""}>${ICON.dl}${z?`Memuatkan foto ${z.done}/${z.total}…`:`Muat turun semua foto (${nAll})`}</button>`;
  const y=window.scrollY, ae=document.activeElement, keepNote=ae&&ae.id==="k-note"?[ae.selectionStart,ae.selectionEnd]:null; // live updates must not interrupt typing
  scr().innerHTML=`
    <button class="back" data-go="list">${ICON.back} Zon ${loc.z}</button>
    <div class="loc-head">
      <span class="eyebrow">Rekod bulan ${fmtMonth(state.month)}</span>
      <h1>${esc(loc.t)}</h1>
      <div class="loc-sub"><span>${esc(loc.j)}</span><span class="kolam">${esc(loc.k)}</span>${pill(st)}</div>
      ${navLinks(loc)}
      ${sn?`<div class="sentline">${ICON.send}${sentLine(sn,true)}</div>`:""}
      ${ct.flag?`<div class="flagbar">${ICON.flag}<div><b>${ct.flag} foto ditolak oleh admin</b><span>Ambil semula foto bertanda merah. Ketik foto untuk lihat sebab.</span></div></div>`:""}
    </div>
    ${tasks}
    ${noteBox(loc,r,can)}
    <div class="submit"><div class="submit-in">${foot}</div></div>`;
  window.scrollTo(0,y);
  if(keepNote){ const ta=document.getElementById("k-note"); if(ta&&!ta.disabled){ ta.focus({preventScroll:true}); try{ta.setSelectionRange(keepNote[0],keepNote[1])}catch{} } }
  bindUploads(scr()); fillNames(); hydrateImgs(scr());
}
function tile(loc,r,t,s,can){
  const p=photo(r,t.key,s.key), key=`${loc.id}|${t.key}|${s.key}`, id=`f-${t.key}-${s.key}`, c=check(loc.id,t.key,s.key);
  const mark=!p?`<span class="req" aria-label="wajib">*</span>`:c.st==="ok"?`<span class="tick" aria-label="disahkan">✓</span>`:c.st==="flag"?`<span class="xmark" aria-label="ditolak">✕</span>`:"";
  const lbl=`<span class="slot-l">${s.label}${mark}</span>`;
  if(state.busy[key]) return `<div class="slot">${lbl}<div class="tile busy"><span class="tile-cta"><span class="spin"></span>${state.busy[key]==="del"?"Memadam":"Memuat naik"}</span></div></div>`;
  if(p){
    const badge=c.st==="ok"?`<span class="tile-rv ok" title="Disahkan">${ICON.check}</span>`:c.st==="flag"?`<span class="tile-rv flag">${ICON.flag}Ditolak</span>`:c.st==="draft"?`<span class="tile-rv draft">Belum hantar</span>`:`<span class="tile-rv pend">Belum semak</span>`;
    const stateLbl=c.st==="ok"?"disahkan":c.st==="flag"?"ditolak":c.st==="draft"?"belum dihantar":"belum disemak";
    return `<div class="slot">${lbl}<button class="tile filled rv-${c.st}" data-view="${t.key}|${s.key}" aria-label="Lihat foto ${t.label} ${s.label}, ${stateLbl}">
      <img ${imgSrc(p.asset)} alt="">${p.lat==null?`<span class="tile-flag">Tiada GPS</span>`:""}${badge}<span class="tile-meta">${fmtDay(p.takenAt||p.at)} · <span data-uid="${esc(p.by||"")}" data-user="${esc(p.user||"")}"></span></span></button>${can?tileActs(t,s):""}${c.st==="flag"?`<span class="slot-note">${esc(c.rv.note)}</span>`:""}</div>`;
  }
  if(!can) return `<div class="slot">${lbl}<div class="tile empty locked"><span class="tile-cta">${ICON.cam}Tiada foto</span></div></div>`;
  return `<div class="slot">${lbl}<label class="tile empty" for="${id}"><input class="vh" type="file" accept="image/*" capture="environment" id="${id}" data-up="${t.key}|${s.key}">
      <span class="tile-cta">${ICON.cam}Ambil foto</span></label></div>`;
}
// Catatan: one remark per kolam per month, written by any signed-in user
const NOTE_MAX=1000;
const noteKey=locId=>`${state.month}|${locId}`;
function noteBox(loc,r,can){
  const n=r?.note, d=state.noteDraft[noteKey(loc.id)], val=d??n?.text??"", dirty=d!=null&&d.trim()!==(n?.text||"");
  const meta=dirty?`<span class="note-dirty">Belum disimpan</span>`:n?`Disimpan ${fmtStamp(new Date(n.at))} · ${esc(showName(n.user||""))}`:"Belum ada catatan.";
  return `<section class="task note"><div class="task-h"><h2>Catatan</h2><span class="cnt" id="k-note-cnt">${val.length}/${NOTE_MAX}</span></div>
      <label class="vh" for="k-note">Catatan pemerhatian di kolam</label>
      <textarea id="k-note" rows="4" maxlength="${NOTE_MAX}" placeholder="Tulis apa-apa yang diperhatikan di kolam ini. Contoh: pagar rosak, air bertakung, longgokan sampah besar." ${can&&!state.noteSaving?"":"disabled"}>${esc(val)}</textarea>
      <div class="note-foot"><span class="note-meta" id="k-note-meta">${meta}</span>
      ${can?`<button class="sbtn solid" data-act="notesave" id="k-note-save" ${dirty&&!state.noteSaving?"":"disabled"}>${state.noteSaving?"Menyimpan…":"Simpan"}</button>`:""}</div></section>`;
}
async function saveNote(){
  const loc=byId[state.locId], month=state.month; if(!loc||state.noteSaving) return;
  const k=noteKey(loc.id), text=(state.noteDraft[k]??"").trim();
  state.noteSaving=true; renderLoc();
  try{
    const doc=await rpc("set_note",{p_month:month,p_loc:loc.id,p_text:text});
    if(doc&&state.month===month) state.reports[loc.id]=doc;
    delete state.noteDraft[k]; toast(text?"Catatan disimpan":"Catatan dipadam");
  }catch(e){
    const m=`${e?.code||""} ${e?.message||""}`;
    toast(/set_note|PGRST202|42883/i.test(m)?"Catatan belum disediakan. Jalankan catatan.sql dalam Supabase.":/1000/.test(m)?`Catatan terlalu panjang (had ${NOTE_MAX} aksara).`:"Catatan tidak dapat disimpan. Semak sambungan dan cuba lagi.",true);
  }finally{ state.noteSaving=false; refresh(); }
}
// Tukar / Padam under each photo (only shown when this user may still change it)
function tileActs(t,s){
  const k=`${t.key}|${s.key}`, id=`t-${t.key}-${s.key}`;
  if(state.delAsk===k) return `<div class="tacts ask" role="group" aria-label="Padam foto ${t.label} ${s.label}?"><span>Padam?</span>
      <button class="tact danger" data-tdelyes="${k}">Ya</button><button class="tact" data-tdelno="1">Batal</button></div>`;
  return `<div class="tacts"><label class="tact" for="${id}">${ICON.swap}Tukar<input class="vh" type="file" accept="image/*" capture="environment" id="${id}" data-up="${k}"></label>
      <button class="tact danger" data-tdel="${k}" aria-label="Padam foto ${t.label} ${s.label}">${ICON.del}Padam</button></div>`;
}
async function bindUploads(root){
  // Bound directly so a pick still lands if a live update re-renders the screen while the picker is open
  root.querySelectorAll("input[data-up]").forEach(el=>{el.onchange=()=>{const [a,b]=el.dataset.up.split("|");const f=el.files&&el.files[0];el.value="";handleUpload(a,b,f)}});
}
function fillNames(){ // users are only ever shown by their username
  document.querySelectorAll("[data-uid]").forEach(e=>{ e.textContent = e.dataset.user ? showName(e.dataset.user) : "—"; });
}

/* ---------- viewer ---------- */
function openViewer(task,stage){state.viewing={task,stage,confirm:false,busy:false,flag:false,note:""};renderViewer()}
const REASONS=["Foto kabur","Lokasi tidak tepat","Kerja belum siap","Sudut tidak jelas","Foto terlalu gelap"];
function reviewBox(c){
  const who=rv=>`${esc(showName(rv.reviewer_name||"")||"Admin")} · ${fmtStamp(new Date(rv.at))}`;
  if(c.st==="flag") return `<div class="rv-box flag"><b>${ICON.flag}Ditolak · perlu ambil semula</b><p>${esc(c.rv.note)}</p><small>${who(c.rv)}</small></div>`;
  if(c.st==="ok") return `<div class="rv-box ok"><b>${ICON.check}Disahkan</b><small>${who(c.rv)}</small></div>`;
  if(c.st==="draft") return `<div class="rv-box pend"><b>Belum dihantar</b><small>${state.isAdmin?"Pekerja belum menekan Hantar. Foto boleh disemak selepas dihantar.":"Tekan Hantar di halaman kolam selepas semua foto dimuat naik."}</small>${c.prev?`<small>Foto sebelum ini ditolak: ${esc(c.prev.note)}</small>`:""}</div>`;
  return `<div class="rv-box pend"><b>Belum disemak oleh admin</b>${c.prev?`<small>Foto sebelum ini ditolak: ${esc(c.prev.note)}</small>`:""}</div>`;
}
function viewerActions(c,can){
  const v=state.viewing, dis=v.busy?"disabled":"";
  if(v.confirm) return `<div class="viewer-act confirm"><div class="viewer-confirm">Padam foto ini? Tindakan ini tidak boleh dibatalkan.</div>
      <button class="vghost" data-act="delno" ${dis}>Batal</button>
      <button class="vdanger" data-act="delyes" ${dis}>${ICON.del}${v.busy?"Memadam…":"Padam"}</button></div>`;
  if(v.flag) return `<div class="viewer-act flagform">
      <div class="viewer-confirm">Kenapa foto ini ditolak?</div>
      <div class="reasons">${REASONS.map(x=>`<button class="reason" data-reason="${esc(x)}" ${dis}>${esc(x)}</button>`).join("")}</div>
      <label class="vh" for="flag-note">Sebab foto ditolak</label>
      <textarea id="flag-note" maxlength="500" rows="2" placeholder="Tulis sebab (wajib). Pekerja akan nampak nota ini." ${dis}>${esc(v.note||"")}</textarea>
      <button class="vghost" data-act="flagno" ${dis}>Batal</button>
      <button class="vdanger" data-act="flagyes" id="flag-go" ${v.busy||!(v.note||"").trim()?"disabled":""}>${ICON.flag}${v.busy?"Menyimpan…":"Tolak foto"}</button></div>`;
  const rows=[];
  if(state.isAdmin&&c.st!=="draft"){
    const a=[];
    if(c.st!=="ok") a.push(`<button class="vok" data-act="rvok" ${dis}>${ICON.check}${v.busy?"Menyimpan…":"Sahkan"}</button>`);
    if(c.st!=="flag") a.push(`<button class="vdanger" data-act="rvflag" ${dis}>${ICON.flag}Tolak</button>`);
    rows.push(a);
  }
  const b=[];
  if(downloads&&state.isAdmin) b.push(`<button class="vghost" data-act="dl" ${dis}>${ICON.dl}Muat turun</button>`);
  if(can){
    const retake=c.st==="flag";
    b.push(`<label for="fv" class="${retake?"vretake":"vplain"}">${retake?ICON.cam:ICON.swap}${retake?"Ambil semula":"Tukar"}<input class="vh" type="file" accept="image/*" capture="environment" id="fv" data-up="${v.task}|${v.stage}"></label>`);
    b.push(`<button class="vghost" data-act="del">${ICON.del}Padam</button>`);
  }
  rows.push(b);
  return rows.filter(x=>x.length).map(x=>`<div class="viewer-act">${x.join("")}</div>`).join("");
}
function fileName(loc,task,stage,p){
  const T=secOf(task).label, S=slotOf(task,stage).label;
  const d=new Date(p.takenAt||p.at), stamp=`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`;
  return `${loc.n} - ${T} - ${S} - ${stamp}.jpg`.replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ");
}
async function downloadPhoto(){
  if(!state.isAdmin) return; // downloads are admin only
  const v=state.viewing, loc=byId[state.locId], p=photo(state.reports[loc.id],v.task,v.stage); if(!p||!downloads) return;
  v.busy=true; renderViewer();
  try{
    const blob=await fetchPhoto(p.asset);
    await downloads.save({filename:fileName(loc,v.task,v.stage,p),data:blob});
    toast("Foto dimuat turun");
  }catch(e){
    if(e?.code==="declined") {}
    else if(e?.code==="rate_limited") toast("Tetingkap simpan sudah dibuka. Cuba lagi sebentar.",true);
    else if(e?.code==="fetch") toast("Foto tidak dapat dimuatkan. Semak sambungan.",true);
    else toast("Muat turun tidak tersedia di sini.",true);
  }finally{ if(state.viewing===v){v.busy=false;renderViewer()} }
}
async function removePhoto(task,stage){
  const loc=byId[state.locId], r=state.reports[loc.id], p=photo(r,task,stage);
  if(!p||!editable(r)||!canChange(loc.id,task,stage)) return false;
  await writePhoto(loc,task,stage,{asset:null,uploads:uploadsOf(r,task,stage)}); // keep the upload count
  assets.delete(p.asset).catch(()=>{});
  return true;
}
async function deletePhoto(){
  const v=state.viewing; if(!v) return;
  v.busy=true; renderViewer();
  try{ if(await removePhoto(v.task,v.stage)){ closeViewer(); toast("Foto dipadam"); } else { v.busy=false; renderViewer(); } }
  catch(e){
    if(state.viewing===v){v.busy=false;renderViewer()}
    toast(/dihantar/i.test(e?.message||"")?"Foto ini telah dihantar dan tidak boleh dipadam.":"Foto tidak dapat dipadam. Cuba lagi.",true);
  }
}
async function deleteFromTile(task,stage){
  const key=`${state.locId}|${task}|${stage}`; if(state.busy[key]) return;
  state.delAsk=null; state.busy[key]="del"; renderLoc();
  try{ if(await removePhoto(task,stage)) toast("Foto dipadam"); }
  catch(e){ toast(/dihantar/i.test(e?.message||"")?"Foto ini telah dihantar dan tidak boleh dipadam.":"Foto tidak dapat dipadam. Cuba lagi.",true); }
  finally{ delete state.busy[key]; refresh(); }
}
function closeViewer(){state.viewing=null;const v=document.getElementById("viewer");v.hidden=true;v.innerHTML=""}
function renderViewer(){
  const v=document.getElementById("viewer"), {task,stage}=state.viewing, loc=byId[state.locId];
  const r=state.reports[loc.id], p=photo(r,task,stage); if(!p) return closeViewer();
  const T=secOf(task), S=slotOf(task,stage), can=editable(r)&&canChange(loc.id,task,stage), c=check(loc.id,task,stage);
  const ae=document.activeElement, keep=ae&&ae.id==="flag-note"?[ae.selectionStart,ae.selectionEnd]:null;  // live updates must not interrupt typing
  v.innerHTML=`<div class="viewer-top"><div><b>${T.label} · ${S.label}</b><span>Muatnaik ${uploadsOf(r,task,stage)} · ${p.takenAt?`Diambil ${fmtStamp(new Date(p.takenAt))}`:`<span class="warn">Tarikh foto tiada</span> · dimuat naik ${fmtStamp(new Date(p.at))}`} · <span data-uid="${esc(p.by||"")}" data-user="${esc(p.user||"")}"></span></span>
      ${p.bytes?`<span>Saiz asal ${fmtBytes(p.bytes)}</span>`:""}
      <span>${p.lat!=null?`<a href="${mapsUrl(p)}" target="_blank" rel="noopener">Lihat di Google Maps</a> <span>(${p.gpsSource==="telefon"?`lokasi telefon${p.gpsAcc?` ±${p.gpsAcc} m`:""}`:"GPS dari foto"})</span>`:`<span class="warn">Tiada lokasi GPS</span>`}</span></div>
      <button class="x" data-act="close" aria-label="Tutup">${ICON.x}</button></div>
    <div class="viewer-img"><img ${imgSrc(p.asset)} alt="${T.label} ${S.label}, ${esc(loc.n)}"></div>
    ${reviewBox(c)}
    ${viewerActions(c,can)}`;
  v.hidden=false; bindUploads(v); fillNames(); hydrateImgs(v);
  if(keep){ const ta=document.getElementById("flag-note"); if(ta){ ta.focus(); try{ta.setSelectionRange(keep[0],keep[1])}catch{} } }
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-zone],[data-go],[data-loc],[data-filter],[data-view],[data-act],[data-auth],[data-admin],[data-reason],[data-xr],[data-tdel],[data-tdelyes],[data-tdelno]"); if(!t) return;
  const aa=t.dataset.act;
  if(aa==="azip"){ downloadMonthZip(); return; }
  if(aa==="adel"){ state.adminDel={ok:false}; renderAdmin(); return; }
  if(aa==="adelno"){ state.adminDel=null; renderAdmin(); return; }
  if(aa==="adelyes"){ if(state.adminDel?.ok) deleteMonth(); return; }
  if(aa==="amprev"||aa==="amnext"){ const nx=shiftMonth(state.adminMonth,aa==="amprev"?-1:1); if(nx>thisMonth()) return; state.adminMonth=nx; state.adminDel=null; loadAdminMonth(); return; }
  if(t.dataset.admin){ const a=t.dataset.admin;
    if(a==="reset"||a==="del"){ state.adminEdit={u:t.dataset.u,mode:a}; renderAdmin(); }
    else if(a==="cancel"){ state.adminEdit=null; renderAdmin(); }
    else if(a==="delyes"){ t.disabled=true; deleteUser(t.dataset.u); }
    return; }
  if(t.dataset.auth){ state.authMode=t.dataset.auth; renderAuth(); return; }
  if(t.dataset.act==="logout"){ signOut(); return; }
  if(t.dataset.tdel){ state.delAsk=t.dataset.tdel; renderLoc(); return; }
  if(t.dataset.tdelno){ state.delAsk=null; renderLoc(); return; }
  if(t.dataset.tdelyes){ const [a,b]=t.dataset.tdelyes.split("|"); deleteFromTile(a,b); return; }
  if(t.dataset.reason){ const v=state.viewing; if(!v) return; const cur=(v.note||"").trim(); v.note=cur?(cur.includes(t.dataset.reason)?cur:`${cur}; ${t.dataset.reason}`):t.dataset.reason; renderViewer(); return; }
  if(t.dataset.zone) go("list",{zone:t.dataset.zone,q:"",filter:t.dataset.f||"all"});
  else if(t.dataset.go) go(t.dataset.go,t.dataset.go==="pwchange"?{forced:false}:{});
  else if(t.dataset.loc) go("loc",t.dataset.z?{locId:t.dataset.loc,zone:t.dataset.z,q:"",filter:"all"}:{locId:t.dataset.loc});
  else if(t.dataset.filter){state.filter=t.dataset.filter;updateList()}
  else if(t.dataset.view){const [a,b]=t.dataset.view.split("|");openViewer(a,b)}
  else if(t.dataset.act==="close") closeViewer();
  else if(t.dataset.act==="dl") downloadPhoto();
  else if(t.dataset.act==="xlsx") exportRange();
  else if(t.dataset.xr){ const [a,b]=t.dataset.xr.split("|"); state.range={from:a,to:b,forMonth:state.month,touched:true}; state.rplan=null; renderExport(); }
  else if(t.dataset.act==="del"){state.viewing.confirm=true;renderViewer()}
  else if(t.dataset.act==="delno"){state.viewing.confirm=false;renderViewer()}
  else if(t.dataset.act==="delyes") deletePhoto();
  else if(t.dataset.act==="mprev"||t.dataset.act==="mnext"){const next=shiftMonth(state.month,t.dataset.act==="mprev"?-1:1);if(next>thisMonth())return;state.month=next;renderMonth();subscribeMonth();refresh();}
  else if(t.dataset.act==="mkreport") createKolamReport();
  else if(t.dataset.act==="kzip") downloadKolamPhotos();
  else if(t.dataset.act==="notesave") saveNote();
  else if(t.dataset.act==="send"){ state.sendConfirm=true; renderLoc(); }
  else if(t.dataset.act==="sendno"){ state.sendConfirm=false; renderLoc(); }
  else if(t.dataset.act==="sendyes") sendKolam();
  else if(t.dataset.act==="rvok") reviewCurrent("ok");
  else if(t.dataset.act==="rvflag"){state.viewing.flag=true;state.viewing.note="";renderViewer();setTimeout(()=>document.getElementById("flag-note")?.focus(),0)}
  else if(t.dataset.act==="flagno"){state.viewing.flag=false;renderViewer()}
  else if(t.dataset.act==="flagyes") reviewCurrent("flag");
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="del-ok"&&state.adminDel){ state.adminDel.ok=el.checked; renderAdmin(); }
  if((el.id==="x-from"||el.id==="x-to")&&!state.export){ const r=syncRange(); state.range={...r,[el.id==="x-from"?"from":"to"]:el.value,touched:true}; state.rplan=null; el.blur(); renderExport(); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){state.q=e.target.value;updateList()}
  if(e.target.id==="k-note"&&state.locId){
    const v=e.target.value, saved=state.reports[state.locId]?.note?.text||""; state.noteDraft[noteKey(state.locId)]=v;
    const dirty=v.trim()!==saved, c=document.getElementById("k-note-cnt"), b=document.getElementById("k-note-save"), m=document.getElementById("k-note-meta");
    if(c) c.textContent=`${v.length}/${NOTE_MAX}`; if(b) b.disabled=!dirty||state.noteSaving;
    if(m&&dirty) m.innerHTML=`<span class="note-dirty">Belum disimpan</span>`;
  }
  if(e.target.id==="flag-note"&&state.viewing){ state.viewing.note=e.target.value; const b=document.getElementById("flag-go"); if(b) b.disabled=state.viewing.busy||!e.target.value.trim(); }
});
document.getElementById("viewer").addEventListener("click",e=>{ if(e.target.classList.contains("viewer-img")) closeViewer(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&state.viewing){ if(state.viewing.flag){state.viewing.flag=false;renderViewer()} else closeViewer(); } });

/* ---------- boot ---------- */
document.getElementById("topbrand-img").src=BLU_LOGO;
renderMonth();
state.me=null; state.authMode="login";
go("auth");
(async()=>{
  ready=true; refresh();
  if(!sb) return;
  try{
    const {data}=await sb.auth.getSession();
    const u=data?.session?.user;
    if(u){
      const prof=await loadProfile(u.id);
      if(prof?.role){ uid=u.id; signedIn(prof.username,prof); return; }
      await sb.auth.signOut();
    }
  }catch{}
})();
</script>
